<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أثر — عرض المقدّمة</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Plex;src:url(assets/fonts/plex-ar-500.woff2)}
body{margin:0;background:#0a0b0f;color:#eee;font-family:Plex,system-ui;display:grid;grid-template-rows:auto 1fr auto;height:100vh}
#top{display:flex;gap:28px;padding:12px 20px;background:#13151b;font-size:18px;align-items:center}
#top b{color:#2ee6c5}#timer{font-family:monospace;font-size:26px;margin-inline-start:auto}
#main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:16px;min-height:0}
.fr{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#bar{height:5px;background:#222;margin-top:8px}#bar i{display:block;height:100%;background:#2ee6c5;width:0}
#notes{font-size:30px;line-height:1.6;padding:8px 4px;overflow:auto}
.lbl{color:#888;font-size:15px;margin:6px 0}
#btns{display:flex;gap:10px;padding:12px 20px;background:#13151b}
#btns button{font-family:Plex;font-size:20px;padding:12px 26px;border-radius:10px;border:0;background:#22262f;color:#eee}
#btns .n{background:#2ee6c5;color:#06201b}
</style></head><body>
<div id="top"><span>النقرة <b id="cnt">–</b></span><span>صفحة <b id="pg">–</b></span><span id="ttl"></span><span id="nm" style="color:#aaa"></span><span id="clock"></span><span id="timer">00:00</span></div>
<div id="main">
  <div><div class="lbl">الآن</div><div class="fr"><iframe id="now" src="index.html?mode=mirror"></iframe></div><div id="bar"><i></i></div><div class="lbl">ملاحظاتك</div><div id="notes">افتحي العرض من index.html ثم اضغطي P.</div></div>
  <div><div class="lbl">النقرة التالية: <span id="nx"></span></div><div class="fr"><iframe id="nxt" src="index.html?mode=preview"></iframe></div></div>
</div>
<div id="btns"><button id="bBack">رجوع</button><button class="n" id="bNext">التالي</button><button id="bBlack">شاشة سوداء</button><button id="bReset">تصفير المؤقت</button></div>
<script>
var show=window.opener, t0=null, st=null;
function send(c){try{show&&show.postMessage({type:'rshd-cmd',cmd:c},'*')}catch(e){}}
function hello(){try{show&&show.postMessage({type:'rshd-hello'},'*')}catch(e){}}
setInterval(hello,3000);hello();
addEventListener('message',function(e){var d=e.data||{};if(d.type!=='rshd-state')return;st=d;show=e.source;
 if(d.i>0&&!t0)t0=Date.now();
 cnt.textContent=d.i+' / '+(d.total-1);pg.textContent=d.page||'—';ttl.textContent=d.title;nm.textContent=d.name;nx.textContent=d.next;
 notes.textContent=d.notes||'';document.querySelector('#bar i').style.width=(d.i/(d.total-1)*100)+'%';
 [['now',d.i],['nxt',d.i]].forEach(function(p){document.getElementById(p[0]).contentWindow.postMessage({type:'rshd-go',i:p[1]},'*')});});
setInterval(function(){var n=new Date();clock.textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
 if(t0){var s=Math.floor((Date.now()-t0)/1000);timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}},500);
bNext.onclick=function(){send('next')};bBack.onclick=function(){send('back')};bBlack.onclick=function(){send('black')};bReset.onclick=function(){t0=Date.now()};
addEventListener('keydown',function(e){var k=e.key;if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n'].indexOf(k)>-1){send('next');e.preventDefault()}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(k)>-1){send('back');e.preventDefault()}else if(k==='b'||k==='.')send('black');});
</script></body></html>
